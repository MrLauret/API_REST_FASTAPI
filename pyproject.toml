[project]
name = "api-rest-incidencia"
version = "0.1.0"
description = "API REST para trabajo de clase"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "config>=0.5.1",
    "dotenv>=0.9.9",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pathlib>=1.0.1",
    "psycopg>=3.3.7",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[project.scripts]
api-rest-incidencia = "api_rest_incidencia:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src/api_rest_incidencia/"]
asyncio_mode = "auto"