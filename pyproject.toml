[project]
name = "api-rest-incidencia"
version = "0.1.0"
description = "API REST para trabajo de clase"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.161.1",
    "pathlib>=1.0.1",
    "pydantic>=2.14.1",
]

[project.scripts]
api-rest-incidencia = "api_rest_incidencia:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
